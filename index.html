<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calco Tattoo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}

h1{
  margin:0;
  font-size:24px;
}

main{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.panel{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

input[type=file]{
  width:100%;
  padding:12px;
  margin-bottom:20px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:10px;
  background:#d40000;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

canvas{
  width:100%;
  background:white;
  margin-top:20px;
  border-radius:10px;
  display:block;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input[type=range]{
  width:100%;
}
</style>
</head>

<body>

<header>
<h1>CALCO TATTOO</h1>
</header>

<main>

<div class="panel">

<input id="photo" type="file" accept="image/*">

<label>
Detalle
<input id="detail" type="range" min="1" max="100" value="50">
</label>

<label>
Contraste
<input id="contrast" type="range" min="1" max="100" value="50">
</label>

<button onclick="processImage()">
GENERAR CALCO
</button>

<button onclick="downloadImage()">
GUARDAR CALCO
</button>

<canvas id="canvas"></canvas>

</div>

</main>

<script>

const photo = document.getElementById("photo");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let originalImage = null;

photo.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            originalImage = img;

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img,0,0);

        };

        img.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


function processImage(){

    if(!originalImage){

        alert("Primero selecciona una fotografía.");

        return;
    }

    const detail =
        Number(document.getElementById("detail").value);

    const contrast =
        Number(document.getElementById("contrast").value);

    canvas.width = originalImage.width;
    canvas.height = originalImage.height;

    ctx.drawImage(
        originalImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data = image.data;

    const factor =
        (259 * (contrast + 255)) /
        (255 * (259 - contrast));

    for(let i=0;i<data.length;i+=4){

        let r=data[i];
        let g=data[i+1];
        let b=data[i+2];

        let gray =
            0.299*r +
            0.587*g +
            0.114*b;

        gray =
            factor * (gray - 128) + 128;

        let threshold =
            255 - detail * 2.2;

        if(gray < threshold){

            data[i]=212;
            data[i+1]=0;
            data[i+2]=0;

        }else{

            data[i]=255;
            data[i+1]=255;
            data[i+2]=255;

        }

    }

    ctx.putImageData(image,0,0);

}


function downloadImage(){

    if(canvas.width === 0){

        alert("Primero genera un calco.");

        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "calco-tattoo.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

}

</script>

</body>
</html>
