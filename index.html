<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calco Tattoo">
<link rel="manifest" href="manifest.json">

<title>Calco Tattoo</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f2f2f2;
    color:#151515;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
    background:#111;
    color:#fff;
    text-align:center;
    padding:17px;
    font-size:22px;
    font-weight:800;
}

main{
    max-width:900px;
    margin:auto;
    padding:16px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 20px #0002;
}

input[type=file]{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:10px;
}

.control{margin-top:17px}

.line{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    margin-bottom:6px;
}

.value{color:#c40000}

input[type=range]{
    width:100%;
    accent-color:#c40000;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

button{
    border:0;
    border-radius:12px;
    padding:15px;
    background:#c40000;
    color:#fff;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
}

button.secondary{background:#222}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.preview{
    margin-top:18px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#fff;
}

canvas{
    display:block;
    max-width:100%;
    height:auto;
    margin:auto;
}

small{
    display:block;
    color:#666;
    margin-top:10px;
    line-height:1.4;
}

@media(max-width:600px){
    .buttons{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>CALCO TATTOO</header>

<main>
<section class="card">

<input id="file" type="file" accept="image/*">

<div class="control">
    <div class="line">
        <span>Fidelidad</span>
        <span id="fv" class="value">90%</span>
    </div>
    <input id="f" type="range" min="0" max="100" value="90">
</div>

<div class="control">
    <div class="line">
        <span>Detalle</span>
        <span id="dv" class="value">50%</span>
    </div>
    <input id="d" type="range" min="0" max="100" value="50">
</div>

<div class="control">
    <div class="line">
        <span>Sombras</span>
        <span id="sv" class="value">10%</span>
    </div>
    <input id="s" type="range" min="0" max="100" value="10">
</div>

<div class="buttons">
    <button id="go" disabled>GENERAR CALCO</button>
    <button id="save" class="secondary" disabled>GUARDAR CALCO</button>
</div>

<div class="preview">
    <canvas id="c"></canvas>
</div>

<small>
Calco de líneas rojas sobre fondo blanco.
Ajusta Fidelidad para conservar contornos, Detalle para líneas internas
y Sombras para recuperar detalles de zonas oscuras.
</small>

</section>
</main>

<script>

const $ = id => document.getElementById(id);

const file = $("file");
const canvas = $("c");
const ctx = canvas.getContext("2d",{willReadFrequently:true});

const src = document.createElement("canvas");
const sx = src.getContext("2d",{willReadFrequently:true});

let ready = false;
let calcoGenerado = false;
let objectURL = null;


/* CONTROLES */

[
    ["f","fv"],
    ["d","dv"],
    ["s","sv"]
].forEach(([control,valor])=>{
    $(control).addEventListener("input",()=>{
        $(valor).textContent = $(control).value + "%";
    });
});


/* CARGAR IMAGEN */

file.addEventListener("change",()=>{

    const archivo = file.files[0];

    if(!archivo) return;

    const imageURL = URL.createObjectURL(archivo);
    const im = new Image();

    im.onload = ()=>{

        const escala = Math.min(
            1,
            1800 / Math.max(im.naturalWidth,im.naturalHeight)
        );

        src.width = Math.round(im.naturalWidth * escala);
        src.height = Math.round(im.naturalHeight * escala);

        sx.clearRect(0,0,src.width,src.height);

        sx.drawImage(
            im,
            0,
            0,
            src.width,
            src.height
        );

        canvas.width = src.width;
        canvas.height = src.height;

        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(src,0,0);

        ready = true;
        calcoGenerado = false;

        $("go").disabled = false;
        $("save").disabled = true;

        URL.revokeObjectURL(imageURL);
    };

    im.onerror = ()=>{
        URL.revokeObjectURL(imageURL);
        alert("No se pudo cargar la imagen.");
    };

    im.src = imageURL;

});


/* ESCALA DE GRISES */

function gray(datos,indice){

    return (
        0.299 * datos[indice] +
        0.587 * datos[indice+1] +
        0.114 * datos[indice+2]
    );

}


/* GENERAR CALCO */

$("go").addEventListener("click",()=>{

    if(!ready) return;

    $("go").disabled = true;
    $("go").textContent = "GENERANDO...";

    setTimeout(()=>{

        try{

            const w = src.width;
            const h = src.height;

            const original = sx.getImageData(0,0,w,h).data;
            const resultado = ctx.createImageData(w,h);
            const datos = resultado.data;

            for(let i=0;i<datos.length;i+=4){
                datos[i] = 255;
                datos[i+1] = 255;
                datos[i+2] = 255;
                datos[i+3] = 255;
            }

            const F = Number($("f").value);
            const D = Number($("d").value);
            const S = Number($("s").value);

            const threshold = Math.max(
                28,
                150 - F * 0.62 - D * 0.34
            );

            const shadowLimit =
                threshold + (100-S) * 1.05;

            for(let y=1;y<h-1;y++){

                for(let x=1;x<w-1;x++){

                    const p = (y*w+x)*4;

                    const A = gray(original,p-4*w-4);
                    const B = gray(original,p-4*w);
                    const C = gray(original,p-4*w+4);

                    const E = gray(original,p-4);
                    const G = gray(original,p+4);

                    const H = gray(original,p+4*w-4);
                    const I = gray(original,p+4*w);
                    const J = gray(original,p+4*w+4);

                    const Q = gray(original,p);

                    const gx =
                        -A + C
                        -2*E + 2*G
                        -H + J;

                    const gy =
                        -A -2*B -C
                        +H +2*I +J;

                    const mag = Math.hypot(gx,gy);

                    const mean =
                        (A+B+C+E+Q+G+H+I+J)/9;

                    const contrast =
                        Math.abs(Q-mean);

                    const limite =
                        contrast > 25
                        ? threshold
                        : shadowLimit;

                    if(mag > limite){

                        datos[p] = 201;
                        datos[p+1] = 0;
                        datos[p+2] = 0;
                        datos[p+3] = 255;

                    }

                }

            }

            ctx.putImageData(resultado,0,0);

            calcoGenerado = true;

            $("save").disabled = false;

        }
        catch(error){

            console.error(error);
            alert("Ocurrió un error al generar el calco.");

        }
        finally{

            $("go").disabled = false;
            $("go").textContent = "GENERAR CALCO";

        }

    },50);

});


/* CREAR PNG DEL CALCO */

function crearBlobCalco(){

    return new Promise((resolve,reject)=>{

        canvas.toBlob(blob=>{

            if(blob){
                resolve(blob);
            }else{
                reject(
                    new Error("No se pudo crear el PNG.")
                );
            }

        },"image/png");

    });

}


/* GUARDAR CALCO */

$("save").addEventListener("click",async()=>{

    if(!calcoGenerado){
        alert("Primero debes generar el calco.");
        return;
    }

    try{

        const blob = await crearBlobCalco();

        const archivo = new File(
            [blob],
            "calco-tatuaje.png",
            {type:"image/png"}
        );


        /* MÉTODO PRINCIPAL:
           COMPARTIR EL ARCHIVO PNG */

        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({files:[archivo]})
        ){

            await navigator.share({
                title:"Calco Tattoo",
                files:[archivo]
            });

            return;
        }


        /* MÉTODO PARA PC */

        if(objectURL){
            URL.revokeObjectURL(objectURL);
        }

        objectURL = URL.createObjectURL(blob);

        const enlace =
            document.createElement("a");

        enlace.href = objectURL;
        enlace.download = "calco-tatuaje.png";

        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();


        setTimeout(()=>{
            if(objectURL){
                URL.revokeObjectURL(objectURL);
                objectURL = null;
            }
        },5000);

    }
    catch(error){

        console.error("Error al guardar:",error);

        /*
        FALLBACK:
        abrir exclusivamente el PNG del canvas
        */

        const dataURL =
            canvas.toDataURL("image/png");

        window.location.assign(dataURL);

    }

});


/* SERVICE WORKER */

if("serviceWorker" in navigator){

    window.addEventListener("load",()=>{

        navigator.serviceWorker
            .register("./sw.js")
            .catch(error=>{
                console.error(
                    "Error Service Worker:",
                    error
                );
            });

    });

}

</script>

</body>
</html>
